
<!DOCTYPE html>
<html>
<head>
    <title>Track Complaint - CivicResolve AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dce7ff, #eadfff);
            margin: 0;
            padding: 30px;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: 80px auto;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px #b9c4df;
        }

        h1 {
            color: #35469c;
        }

        p {
            color: #666;
        }

        input {
            width: 90%;
            padding: 13px;
            margin: 20px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            background: #5846cf;
            color: white;
            padding: 13px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #35258e;
        }

        #result {
            margin-top: 20px;
            color: #35469c;
            font-weight: normal;
            text-align: left;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .complaint-card {
            background: #f3f5ff;
            padding: 18px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .status {
            display: inline-block;
            background: #fff0c2;
            color: #805b00;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .error {
            color: #d32f2f;
            text-align: center;
        }

        .success {
            color: #218838;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔍 Track Your Complaint</h1>

    <p>Enter your Complaint ID to check its status.</p>

    <input
        type="text"
        id="complaintId"
        placeholder="Enter Complaint ID"
    >

    <br>

    <button id="trackButton" onclick="trackComplaint()">
        Track Complaint
    </button>

    <div id="result"></div>

</div>

<script>

    async function trackComplaint() {

        const id = document.getElementById("complaintId")
            .value.trim();

        const result = document.getElementById("result");
        const button = document.getElementById("trackButton");

        if (id === "") {
            result.innerHTML =
                '<p class="error">Please enter your Complaint ID.</p>';
            return;
        }

        result.textContent = "Searching for your complaint...";
        button.disabled = true;

        try {

            const response = await fetch(
                "http://127.0.0.1:5000/api/track-complaint/"
                + encodeURIComponent(id)
            );

            const data = await response.json();

            if (!response.ok || !data.success) {
                result.innerHTML =
                    '<p class="error">' +
                    "Complaint not found. Please check your ID." +
                    '</p>';
                return;
            }

            const complaint = data.complaint;

            function escapeHTML(value) {
                return String(value ?? "").replace(
                    /[&<>"']/g,
                    character => ({
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                        "'": "&#39;"
                    })[character]
                );
            }

            result.innerHTML = `
                <div class="complaint-card">

                    <h3 class="success">
                        ✅ Complaint Found!
                    </h3>

                    <p>
                        <b>Complaint ID:</b><br>
                        ${escapeHTML(complaint.complaint_id)}
                    </p>

                    <p>
                        <b>Name:</b><br>
                        ${escapeHTML(complaint.name)}
                    </p>

                    <p>
                        <b>Category:</b><br>
                        ${escapeHTML(complaint.category)}
                    </p>

                    <p>
                        <b>Location:</b><br>
                        ${escapeHTML(complaint.location)}
                    </p>

                    <p>
                        <b>Description:</b><br>
                        ${escapeHTML(complaint.description)}
                    </p>

                    <p>
                        <b>Current Status:</b><br>
                        <span class="status">
                            ${escapeHTML(complaint.status)}
                        </span>
                    </p>

                    <p>
                        <b>Submitted On:</b><br>
                        ${escapeHTML(complaint.created_at)}
                    </p>

                    <hr>

                    <h3>🤖 AI Analysis</h3>

                    <p style="white-space: pre-wrap;">
                        ${escapeHTML(complaint.ai_analysis)}
                    </p>

                </div>
            `;

        } catch (error) {

            result.innerHTML =
                '<p class="error">' +
                "Unable to connect to the backend. " +
                "Please make sure Flask is running." +
                '</p>';

            console.error(error);

        } finally {

            button.disabled = false;

        }

    }

</script>

</body>
</html>
